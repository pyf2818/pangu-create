<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="盘古开天 · pangu-create">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070810"/>
      <stop offset="0.55" stop-color="#0B0D15"/>
      <stop offset="1" stop-color="#12151E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="16%" r="58%">
      <stop offset="0" stop-color="#F3D8A8" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#9A6B3F" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="split" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E6C6" stop-opacity="0"/>
      <stop offset="0.30" stop-color="#F6E6C6" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#F6E6C6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F6E6C6" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8955A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8C08A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C8955A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <line x1="600" y1="24" x2="600" y2="268" stroke="url(#split)" stroke-width="1.2"/>
  <line x1="120" y1="270" x2="1080" y2="270" stroke="url(#horizon)" stroke-width="1"/>
  <circle cx="600" cy="94" r="2.4" fill="#F6E6C6" opacity="0.95"/>
  <circle cx="600" cy="94" r="7" fill="none" stroke="#F6E6C6" stroke-opacity="0.18" stroke-width="1"/>

  <text x="600" y="182" text-anchor="middle" font-family="'Noto Serif SC','Songti SC','STSong',serif" font-size="56" font-weight="600" letter-spacing="18" fill="#F3EFE6">盘古开天</text>
  <text x="600" y="218" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" font-size="11" letter-spacing="7" fill="#9AA1B0">PANGU-CREATE</text>
  <text x="600" y="250" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" letter-spacing="2.2" fill="#7C8494">万物皆可成技能 · 把任何领域锻造成可运行、可验收、可进化的 Agent Skill</text>

  <g font-family="'SF Mono','JetBrains Mono',Consolas,monospace" font-size="10" letter-spacing="2.4" fill="#6B7280">
    <text x="60" y="52">FORGE / 锻造</text>
    <text x="1140" y="52" text-anchor="end">EVOLVE / 进化</text>
    <text x="60" y="292">VERIFY / 验收</text>
    <text x="1140" y="292" text-anchor="end">01 · AGENT SKILL</text>
  </g>
</svg>
